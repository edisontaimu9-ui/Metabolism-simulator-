[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metabosim"
version = "0.1.0"
description = "A modular, extensible Human Metabolism & Energy Expenditure Simulation Engine for research, education, and clinical nutrition."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "black>=24.1",
    "mypy>=1.8",
    "ruff>=0.2",
    "pre-commit>=3.6",
]
gui = [
    "PyQt6>=6.6",
]

[project.scripts]
metabosim = "metabosim.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["metabosim"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers --import-mode=importlib"
markers = [
    "unit: fast, isolated unit tests",
    "integration: multi-module integration tests",
    "validation: tolerance-band tests against published literature data",
]

[tool.coverage.run]
source = ["src/metabosim"]
omit = ["*/reports/*", "*/cli/*"]
